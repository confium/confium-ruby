name: test-and-release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The gem requires Ruby >= 3.1 (rb_sys dependency).
        ruby: [ '3.1', '3.2', '3.3', '3.4' ]
        # The extension is pure Rust (the vendored RNP/Botan C++ stack
        # was dropped), so Windows builds and ships like every other
        # platform.
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle
        run: bundle install

      - name: Point bindgen at MSYS2 headers
        # RubyInstaller rbconfig records HAVE_STRINGS_H; rb-sys bindgen
        # then needs the MSYS2 POSIX headers on its include path. The
        # windows runners ship MSYS2 at C:\msys64.
        if: runner.os == 'Windows'
        run: |
          for d in "C:/msys64/ucrt64/include" "D:/msys64/ucrt64/include"; do
            if [ -d "$d" ]; then
              echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $d" >> "$GITHUB_ENV"
              echo "MSYS include dir: $d"
              exit 0
            fi
          done
          echo "MSYS2 not found; bindgen may fail" >&2

      - name: Build native extension
        run: bundle exec rake compile

      - name: Run specs
        run: bundle exec rspec

  examples:
    # Examples rot silently when nothing runs them (all five hello_*
    # quickstarts were broken against the real APIs until 2026-08-22).
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build native extension
        run: bundle exec rake compile

      - name: Run every example
        run: |
          set -eu
          for f in examples/*.rb; do
            case "$f" in
              */verifier_sinatra.rb) continue ;;  # server; covered below
            esac
            echo "== $(basename "$f")"
            ruby -Ilib "$f" > /dev/null
          done

      - name: Sinatra verifier integration test
        run: bash scripts/sinatra_integration_test.sh

  lint:
    name: RuboCop + Steep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec steep check

  release:
    name: Release gem
    needs: [ build-and-test, lint ]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build native extension + gem
        run: |
          bundle exec rake compile
          gem build confium.gemspec

      # Exchange the job's OIDC token (id-token: write) for a short-lived
      # RubyGems API key; publishes via the gem's trusted publisher
      # (confium/confium-ruby @ test-and-release.yml) on rubygems.org.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push confium-*.gem
