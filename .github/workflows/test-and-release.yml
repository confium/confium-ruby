name: test-and-release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The gem requires Ruby >= 3.1 (rb_sys dependency).
        ruby: [ '3.1', '3.2', '3.3', '3.4' ]
        # The extension is pure Rust (the vendored RNP/Botan C++ stack
        # was dropped), so Windows builds and ships like every other
        # platform.
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle
        run: bundle install

      - name: Provide POSIX stubs for bindgen
        # RubyInstaller rbconfig records HAVE_* for a set of POSIX
        # headers, so rb-sys bindgen reaches for them, but the
        # MSVC-target clang has no provider. The declarations only
        # need to parse — the linked extension never calls them — so
        # stub headers are sufficient and hermetic.
        if: runner.os == 'Windows'
        run: |
          stubs="$RUNNER_TEMP/posix-stubs"
          mkdir -p "$stubs/sys"
          printf '%s\n' '#pragma once' '#include <string.h>' \
            'int ffs(int);' \
            'int strcasecmp(const char *, const char *);' \
            'int strncasecmp(const char *, const char *, size_t);' \
            > "$stubs/strings.h"
          printf '%s\n' '#pragma once' '#include <io.h>' '#include <process.h>' '#include <direct.h>' \
            'typedef int pid_t;' 'typedef long ssize_t;' \
            'int pipe(int *);' 'pid_t fork(void);' 'pid_t getpid(void);' \
            'int execv(const char *, char *const *);' \
            'int execvp(const char *, char *const *);' \
            'int truncate(const char *, long long);' \
            'int readlink(const char *, char *, size_t);' \
            'int symlink(const char *, const char *);' \
            'int link(const char *, const char *);' \
            'unsigned int alarm(unsigned int);' \
            > "$stubs/unistd.h"
          printf '%s\n' '#pragma once' 'typedef struct DIR DIR;' \
            'struct dirent { char d_name[1]; };' \
            'DIR *opendir(const char *);' 'struct dirent *readdir(DIR *);' \
            'int closedir(DIR *);' \
            > "$stubs/dirent.h"
          printf '%s\n' '#pragma once' '#define WNOHANG 1' \
            '#define WIFEXITED(s) (1)' '#define WEXITSTATUS(s) (0)' \
            'int wait(int *);' 'int waitpid(int, int *, int);' \
            > "$stubs/sys/wait.h"
          printf '%s\n' '#pragma once' '#include <time.h>' \
            'struct timeval { long tv_sec; long tv_usec; };' \
            'struct timezone { int dummy; };' \
            'int gettimeofday(struct timeval *, struct timezone *);' \
            > "$stubs/sys/time.h"
          printf '%s\n' '#pragma once' '#include <sys/types.h>' \
            > "$stubs/sys/select.h"
          printf '%s\n' '#pragma once' '#define FNM_NOFLAGS 0' '#define FNM_PATHNAME 1' \
            'int fnmatch(const char *, const char *, int);' \
            > "$stubs/fnmatch.h"
          printf '%s\n' '#pragma once' 'char *basename(char *);' 'char *dirname(char *);' \
            > "$stubs/libgen.h"
          stub_path="$(cygpath -m "$stubs")"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $stub_path" >> "$GITHUB_ENV"
          echo "stub include dir: $stub_path"

      - name: Build native extension
        run: bundle exec rake compile

      - name: Run specs
        run: bundle exec rspec

  examples:
    # Examples rot silently when nothing runs them (all five hello_*
    # quickstarts were broken against the real APIs until 2026-08-22).
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build native extension
        run: bundle exec rake compile

      - name: Run every example
        run: |
          set -eu
          for f in examples/*.rb; do
            case "$f" in
              */verifier_sinatra.rb) continue ;;  # server; covered below
            esac
            echo "== $(basename "$f")"
            ruby -Ilib "$f" > /dev/null
          done

      - name: Sinatra verifier integration test
        run: bash scripts/sinatra_integration_test.sh

  lint:
    name: RuboCop + Steep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec steep check

  release:
    name: Release gem
    needs: [ build-and-test, lint ]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build native extension + gem
        run: |
          bundle exec rake compile
          gem build confium.gemspec

      # Exchange the job's OIDC token (id-token: write) for a short-lived
      # RubyGems API key; publishes via the gem's trusted publisher
      # (confium/confium-ruby @ test-and-release.yml) on rubygems.org.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push confium-*.gem
