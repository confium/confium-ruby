name: test-and-release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The gem requires Ruby >= 3.1 (rb_sys dependency).
        ruby: [ '3.1', '3.2', '3.3', '3.4' ]
        # Windows is absent deliberately: the vendored RNP build
        # (rnp-src → json-c, botan) does not compile under MSVC, so
        # the gem ships no Windows natives (see rakelib/native_gem.rake
        # PLATFORMS). Testing an artifact we never ship only fails CI.
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle
        run: bundle install

      - name: Build native extension
        run: bundle exec rake compile

      - name: Run specs
        run: bundle exec rspec

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop

  release:
    name: Release gem
    needs: [ build-and-test, lint ]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build native extension + gem
        run: |
          bundle exec rake compile
          gem build confium.gemspec

      # Exchange the job's OIDC token (id-token: write) for a short-lived
      # RubyGems API key; publishes via the gem's trusted publisher
      # (confium/confium-ruby @ test-and-release.yml) on rubygems.org.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push confium-*.gem
