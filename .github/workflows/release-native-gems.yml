name: release-native-gems

# Pre-compiled native gem builder.
#
# Triggered on tag push (v*.*.*) — builds platform gems for Linux
# (x86_64/aarch64) and macOS (x86_64/arm64) on runners whose
# architecture IS the target, then publishes each to RubyGems.
#
# Cross-compilation via rake-compiler-dock is not possible here: the
# dock images are Ubuntu 20.04 (gcc 9.4) and the vendored RNP stack
# needs Botan 3.12, which requires gcc 11+.
#
# The source gem is owned by test-and-release.yml; this workflow must
# never push a ruby-platform gem — a source gem pushed here would burn
# the version slot (RubyGems blocks re-pushing any version).
#
# Local dry-run (build + package only, never publishes):
#   bundle exec rake compile && bundle exec rake native_gem:package[arm64-darwin]

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.ref_name }}'
  cancel-in-progress: true

jobs:
  build:
    name: native gem — ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: x86_64-darwin
            # macos-13 (Intel) is retired; macos-15-intel is the
            # x86_64 macOS runner.
            runner: macos-15-intel
          # Windows is absent deliberately: the vendored RNP build
          # (rnp-src → json-c, botan) has no MSVC/mingw story, so the
          # gem ships no Windows natives (see rakelib/native_gem.rake).
          - platform: arm64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      # Oldest supported Ruby: the extension loads on newer Rubies
      # via the stable C extension ABI (guarded by install-check).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Compile extension and package gem
        run: |
          bundle exec rake compile
          bundle exec rake native_gem:package[${{ matrix.platform }}]

      - uses: actions/upload-artifact@v7
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem

  install-check:
    # The platform gems are compiled against Ruby 3.1; prove they
    # install and load on the oldest AND newest supported Rubies.
    name: install check — ${{ matrix.platform }} / Ruby ${{ matrix.ruby }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.1'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.4'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.1'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.4'
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/download-artifact@v8
        with:
          name: native-gem-${{ matrix.platform }}
          path: gems/

      - name: Install and exercise the pre-built gem
        run: |
          set -eu
          gem install --local "gems/confium-*-${{ matrix.platform }}.gem" --no-document
          ruby -r confium -e '
            kp = Confium::Composite.generate_ed25519_keypair
            component = Confium::Composite.sign_ed25519(kp["private_key"], "smoke")
            result = Confium::Composite::Signature.new([component]).verify("smoke")
            abort "signature verification failed" unless result.all_verified?
            puts "composite sign/verify roundtrip OK on #{RUBY_VERSION} (${{ matrix.platform }})"
          '

  publish:
    name: Publish to RubyGems
    needs: [ build, install-check ]
    # Tags only — a manual workflow_dispatch must never push (a failed
    # push still burns the version slot for the platform).
    if: contains(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gems/
          merge-multiple: true
          pattern: native-gem-*

      - name: Verify artifacts
        run: |
          set -eu
          shopt -s nullglob
          gems=(gems/*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "no native gems were built" >&2
            exit 1
          fi
          for gem in "${gems[@]}"; do
            platform="$(gem specification "$gem" platform)"
            echo "$gem -> platform $platform"
            if [ "$platform" = "ruby" ]; then
              echo "refusing to push a ruby-platform gem from the native workflow" >&2
              exit 1
            fi
          done

      # Exchange the job's OIDC token (id-token: write) for a short-lived
      # RubyGems API key; publishes via the gem's trusted publisher
      # (confium/confium-ruby @ release-native-gems.yml) on rubygems.org.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish all native gems
        run: |
          set -eu
          shopt -s nullglob
          for gem in gems/*.gem; do
            echo "Pushing $gem"
            gem push "$gem"
          done
