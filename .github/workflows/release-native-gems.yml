name: release-native-gems

# Pre-compiled native gem builder.
#
# Triggered on tag push (v*.*.*) — builds platform gems for Linux
# (x86_64/aarch64) and macOS (x86_64/arm64) on runners whose
# architecture IS the target, then publishes each to RubyGems.
#
# The extension is pure Rust (the vendored RNP/Botan C++ stack was
# dropped when armor moved to Ruby), so every platform — including
# Windows and musl — builds with just a Rust toolchain.
#
# One extension cannot span all supported Rubies: Ruby 3.2 broke the
# 3.1 ABI (a 3.1-built extension segfaults on 3.2), and rb-sys
# references ruby_current_vm_ptr on Ruby <= 3.2, which libruby
# stopped exporting in 3.3. Each platform gem therefore carries one
# .so per C-ABI window: exact minors 3.1 and 3.2, plus 3.3 (loads
# on 3.3+). lib/confium.rb picks the directory for the running Ruby.
#
# The source gem is owned by test-and-release.yml; this workflow must
# never push a ruby-platform gem — a source gem pushed here would burn
# the version slot (RubyGems blocks re-pushing any version).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.ref_name }}'
  cancel-in-progress: true

jobs:
  build:
    name: extension — ${{ matrix.platform }} / Ruby ${{ matrix.abi }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Windows and musl became possible once the vendored RNP
      # (json-c/botan C/C++) build was dropped: the extension is now
      # pure Rust, which the mingw and musl toolchains build natively.
      matrix:
        platform: [ x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin, x64-mingw-ucrt ]
        abi: [ '3.1', '3.2', '3.3' ]
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          # macos-13 (Intel) is retired; macos-15-intel is the x86_64
          # macOS runner.
          - platform: x86_64-darwin
            runner: macos-15-intel
          - platform: arm64-darwin
            runner: macos-15
          - platform: x64-mingw-ucrt
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.abi }}
          bundler-cache: true

      - name: Compile extension into its ABI window
        run: |
          bundle exec rake compile:release
          ext="$(find lib/confium_native -maxdepth 1 -name 'confium_native.*' -type f)"
          # Strip local/debug symbols; the prebuilt gem has shipped
          # multi-MB to 73 MB binaries without this.
          if command -v strip >/dev/null; then
            if [ "$(uname -s)" = Darwin ]; then strip -x "$ext"; else strip "$ext" || true; fi
          fi
          mkdir -p "stage/${{ matrix.abi }}"
          cp "$ext" "stage/${{ matrix.abi }}/"
          ls -la "stage/${{ matrix.abi }}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-so-${{ matrix.platform }}-${{ matrix.abi }}
          path: stage

  package:
    name: package — ${{ matrix.platform }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin, x64-mingw-ucrt ]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v8
        with:
          path: so/
          pattern: native-so-${{ matrix.platform }}-*
          merge-multiple: true

      - name: Stage ABI windows and package
        run: |
          ls -laR so/
          mkdir -p lib/confium_native
          cp -R so/3.1 so/3.2 so/3.3 lib/confium_native/
          bundle exec rake native_gem:package[${{ matrix.platform }}]

      - uses: actions/upload-artifact@v7
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem

  musl:
    # Alpine/musl builds happen in a container — no musl runner exists.
    # The extension is pure Rust, so ruby:3.x-alpine + a Rust toolchain
    # is all it takes. Builds, packages, and install-checks all three
    # ABI windows in the one container.
    name: native gem — x86_64-linux-musl
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ '3.1', '3.2', '3.3' ]
    steps:
      - uses: actions/checkout@v7

      - name: Build the extension in Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work "ruby:${{ matrix.abi }}-alpine" sh -exc '
            apk add --no-cache rust cargo make binutils
            gem install rake rake-compiler rb_sys --no-document
            rake compile:release
            strip lib/confium_native/confium_native.so
            mkdir -p stage/${{ matrix.abi }}
            mv lib/confium_native/confium_native.so stage/${{ matrix.abi }}/
          '
          # stage/<abi>/confium_native.so is picked up by the artifact
          # upload below; packaging merges the three windows.

      - uses: actions/upload-artifact@v7
        with:
          name: native-so-x86_64-linux-musl-${{ matrix.abi }}
          path: stage

  musl-package:
    name: package — x86_64-linux-musl
    needs: musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          path: so/
          pattern: native-so-x86_64-linux-musl-*
          merge-multiple: true
      - name: Stage ABI windows and package
        run: |
          mkdir -p lib/confium_native
          cp -R so/3.1 so/3.2 so/3.3 lib/confium_native/
          bundle exec rake native_gem:package[x86_64-linux-musl]
      - uses: actions/upload-artifact@v7
        with:
          name: native-gem-x86_64-linux-musl
          path: pkg/*-x86_64-linux-musl.gem

  musl-install-check:
    name: install check — x86_64-linux-musl / Ruby ${{ matrix.abi }}
    needs: musl-package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ '3.1', '3.2', '3.3' ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-gem-x86_64-linux-musl
          path: gems/

      - name: Install and exercise the pre-built gem in Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work "ruby:${{ matrix.abi }}-alpine" sh -exc '
            gem install --local /work/gems/confium-*-x86_64-linux-musl.gem --no-document
            ruby -r confium -e "
              kp = Confium::Composite.generate_ed25519_keypair
              component = Confium::Composite.sign_ed25519(kp[\"private_key\"], \"smoke\")
              result = Confium::Composite::Signature.new([component]).verify(\"smoke\")
              abort \"verification failed\" unless result.all_verified?
              puts \"musl roundtrip OK #{RUBY_VERSION}\"
            "
          '

  install-check:
    # Prove each platform gem installs and loads on every supported
    # Ruby before anything can publish.
    name: install check — ${{ matrix.platform }} / Ruby ${{ matrix.ruby }}
    needs: [ package, musl-package ]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.1'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.2'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.3'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.4'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.1'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.2'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.3'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.4'
          - platform: x64-mingw-ucrt
            runner: windows-latest
            ruby: '3.1'
          - platform: x64-mingw-ucrt
            runner: windows-latest
            ruby: '3.2'
          - platform: x64-mingw-ucrt
            runner: windows-latest
            ruby: '3.3'
          - platform: x64-mingw-ucrt
            runner: windows-latest
            ruby: '3.4'
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/download-artifact@v8
        with:
          name: native-gem-${{ matrix.platform }}
          path: gems/

      - name: Install and exercise the pre-built gem
        run: |
          set -eu
          gem install --local "gems/confium-*-${{ matrix.platform }}.gem" --no-document
          ruby -r confium -e '
            kp = Confium::Composite.generate_ed25519_keypair
            component = Confium::Composite.sign_ed25519(kp["private_key"], "smoke")
            result = Confium::Composite::Signature.new([component]).verify("smoke")
            abort "signature verification failed" unless result.all_verified?
            puts "composite sign/verify roundtrip OK on #{RUBY_VERSION} (${{ matrix.platform }})"
          '

  publish:
    name: Publish to RubyGems
    needs: [ package, install-check, musl-install-check ]
    # Tags only — a manual workflow_dispatch must never push (a failed
    # push still burns the version slot for the platform).
    if: contains(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gems/
          merge-multiple: true
          pattern: native-gem-*

      - name: Verify artifacts
        run: |
          set -eu
          shopt -s nullglob
          gems=(gems/*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "no native gems were built" >&2
            exit 1
          fi
          for gem in "${gems[@]}"; do
            platform="$(gem specification "$gem" platform)"
            echo "$gem -> platform $platform"
            if [ "$platform" = "ruby" ]; then
              echo "refusing to push a ruby-platform gem from the native workflow" >&2
              exit 1
            fi
          done

      # Exchange the job's OIDC token (id-token: write) for a short-lived
      # RubyGems API key; publishes via the gem's trusted publisher
      # (confium/confium-ruby @ release-native-gems.yml) on rubygems.org.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish all native gems
        run: |
          set -eu
          shopt -s nullglob
          for gem in gems/*.gem; do
            echo "Pushing $gem"
            gem push "$gem"
          done
