name: release-native-gems

# Pre-compiled native gem builder.
#
# Triggered on tag push (v*.*.*) — builds platform gems for Linux
# (x86_64/aarch64) and macOS (x86_64/arm64) on runners whose
# architecture IS the target, then publishes each to RubyGems.
#
# Cross-compilation via rake-compiler-dock is not possible here: the
# dock images are Ubuntu 20.04 (gcc 9.4) and the vendored RNP stack
# needs Botan 3.12, which requires gcc 11+.
#
# One extension cannot span all supported Rubies (rb-sys references
# ruby_current_vm_ptr on Ruby <= 3.2, which libruby stopped exporting
# in 3.3), so each platform gem carries one .so per C-ABI window:
# 3.1 (loads on 3.1/3.2) and 3.3 (loads on 3.3+). lib/confium.rb
# picks the directory for the running Ruby.
#
# The source gem is owned by test-and-release.yml; this workflow must
# never push a ruby-platform gem — a source gem pushed here would burn
# the version slot (RubyGems blocks re-pushing any version).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.ref_name }}'
  cancel-in-progress: true

jobs:
  build:
    name: extension — ${{ matrix.platform }} / Ruby ${{ matrix.abi }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin ]
        abi: [ '3.1', '3.3' ]
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          # macos-13 (Intel) is retired; macos-15-intel is the x86_64
          # macOS runner. Windows is absent: the vendored RNP build
          # (rnp-src → json-c, botan) has no MSVC/mingw story (see
          # rakelib/native_gem.rake).
          - platform: x86_64-darwin
            runner: macos-15-intel
          - platform: arm64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.abi }}
          bundler-cache: true

      - name: Compile extension into its ABI window
        run: |
          bundle exec rake compile
          mkdir -p "lib/confium_native/${{ matrix.abi }}"
          cp lib/confium_native/confium_native.* "lib/confium_native/${{ matrix.abi }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: native-so-${{ matrix.platform }}-${{ matrix.abi }}
          path: lib/confium_native/${{ matrix.abi }}/confium_native.*

  package:
    name: package — ${{ matrix.platform }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin ]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v8
        with:
          path: so/
          pattern: native-so-${{ matrix.platform }}-*
          merge-multiple: true

      - name: Stage ABI windows and package
        run: |
          ls -laR so/
          mkdir -p lib/confium_native
          cp -R so/3.1 so/3.3 lib/confium_native/
          bundle exec rake native_gem:package[${{ matrix.platform }}]

      - uses: actions/upload-artifact@v7
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem

  install-check:
    # Prove each platform gem installs and loads on every supported
    # Ruby before anything can publish.
    name: install check — ${{ matrix.platform }} / Ruby ${{ matrix.ruby }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.1'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.2'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.3'
          - platform: x86_64-linux
            runner: ubuntu-latest
            ruby: '3.4'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.1'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.2'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.3'
          - platform: arm64-darwin
            runner: macos-latest
            ruby: '3.4'
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/download-artifact@v8
        with:
          name: native-gem-${{ matrix.platform }}
          path: gems/

      - name: Install and exercise the pre-built gem
        run: |
          set -eu
          gem install --local "gems/confium-*-${{ matrix.platform }}.gem" --no-document
          ruby -r confium -e '
            kp = Confium::Composite.generate_ed25519_keypair
            component = Confium::Composite.sign_ed25519(kp["private_key"], "smoke")
            result = Confium::Composite::Signature.new([component]).verify("smoke")
            abort "signature verification failed" unless result.all_verified?
            puts "composite sign/verify roundtrip OK on #{RUBY_VERSION} (${{ matrix.platform }})"
          '

  publish:
    name: Publish to RubyGems
    needs: [ package, install-check ]
    # Tags only — a manual workflow_dispatch must never push (a failed
    # push still burns the version slot for the platform).
    if: contains(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: gems/
          merge-multiple: true
          pattern: native-gem-*

      - name: Verify artifacts
        run: |
          set -eu
          shopt -s nullglob
          gems=(gems/*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "no native gems were built" >&2
            exit 1
          fi
          for gem in "${gems[@]}"; do
            platform="$(gem specification "$gem" platform)"
            echo "$gem -> platform $platform"
            if [ "$platform" = "ruby" ]; then
              echo "refusing to push a ruby-platform gem from the native workflow" >&2
              exit 1
            fi
          done

      # Exchange the job's OIDC token (id-token: write) for a short-lived
      # RubyGems API key; publishes via the gem's trusted publisher
      # (confium/confium-ruby @ release-native-gems.yml) on rubygems.org.
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish all native gems
        run: |
          set -eu
          shopt -s nullglob
          for gem in gems/*.gem; do
            echo "Pushing $gem"
            gem push "$gem"
          done
