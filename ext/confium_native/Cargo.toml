# confium_native — Rust native extension for the confium Ruby gem.
#
# Compiles to a Ruby-loadable cdylib (`confium_native.bundle` / `.so` / `.dll`)
# via `rb_sys` + `magnus`. The Ruby side loads it through `ext/confium_native/extconf.rb`
# (invoked by `gem install` or `bundle exec rake compile`).

[package]
name = "confium_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["cdylib"]

build = "build.rs"

[dependencies]
# rb-sys for Ruby C API access. `global-allocator` lets the extension own its
# own allocator rather than sharing Ruby's, which avoids a class of GC bugs.
rb-sys = { version = "0.9.124", features = ["global-allocator"] }

# magnus for idiomatic Ruby <-> Rust bindings.
magnus = { version = "0.8", features = ["bytes"] }

# Confium crates from crates.io. Keep these in sync with the workspace
# version of the confium-rs repo so a `bundle exec rake compile` produces
# an extension whose behavior matches the Rust library of the same version.
confium-core = "0.2"
confium-transparency = "0.3"
confium-composite = "0.3"
confium-attributes = "0.3"
confium-pki = "0.3"
confium-deployment = "0.3"
confium-tc-frost-p256 = "0.3"
confium-tc-elgamal-p256 = "0.3"

# P-256 scalar/point types used by the TC surface.
p256 = { version = "0.13", features = ["ecdsa"] }

ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

sha2 = "0.10"
chrono = "0.4"
serde_json = "1"

[profile.release]
lto = "off"
